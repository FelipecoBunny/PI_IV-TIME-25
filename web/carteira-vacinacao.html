<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira de vacinação</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --color-primary: #B4540C; --color-primary-hover: #98460A; --color-primary-soft: #FDEBDD; --color-on-primary: #FFFFFF;
  --color-bg: #F4F6F8; --color-surface: #FFFFFF; --color-border: #D9DFE5; --color-header: #5B6B7A;
  --color-text: #2B3440; --color-text-muted: #5F6B76; --color-placeholder: #6B7783;
  --color-success: #2E7D4F; --color-success-soft: #E6F4EC; --color-warning: #8A5A00; --color-warning-soft: #FDF3DC;
  --color-danger: #B3261E; --color-danger-soft: #FDECEA; --color-focus: #2F6FBF;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-primary: #F0A064; --color-primary-hover: #F5B280; --color-primary-soft: #3A2616; --color-on-primary: #2A1604;
    --color-bg: #14181D; --color-surface: #1D232A; --color-border: #36404A; --color-header: #36424E;
    --color-text: #E8ECF0; --color-text-muted: #A5B0BA; --color-placeholder: #8C99A5;
    --color-success: #6CC48F; --color-success-soft: #17301F; --color-warning: #E8B84F; --color-warning-soft: #33270E;
    --color-danger: #F2877F; --color-danger-soft: #3A1B19; --color-focus: #7DB2F0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-primary: #F0A064; --color-primary-hover: #F5B280; --color-primary-soft: #3A2616; --color-on-primary: #2A1604;
  --color-bg: #14181D; --color-surface: #1D232A; --color-border: #36404A; --color-header: #36424E;
  --color-text: #E8ECF0; --color-text-muted: #A5B0BA; --color-placeholder: #8C99A5;
  --color-success: #6CC48F; --color-success-soft: #17301F; --color-warning: #E8B84F; --color-warning-soft: #33270E;
  --color-danger: #F2877F; --color-danger-soft: #3A1B19; --color-focus: #7DB2F0; color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font: 400 16px/1.5 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bar { background: var(--color-header); color: #fff; padding: 14px 24px; font-weight: 700; font-size: 1.15rem; }
main { max-width: 1000px; margin: 0 auto; padding: 24px 20px 56px; }
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 10px; }
.patient { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 16px 20px; margin-bottom: 16px; }
.patient dt { color: var(--color-text-muted); font-size: .8rem; }
.patient dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { border: 1px solid; border-radius: 10px; padding: 12px 18px; }
.stat span { font-weight: 700; font-size: .85rem; }
.stat b { display: block; font-size: 2rem; line-height: 1.2; }
.ok { color: var(--color-success); background: var(--color-success-soft); border-color: var(--color-success); }
.soon { color: var(--color-warning); background: var(--color-warning-soft); border-color: var(--color-warning); }
.late { color: var(--color-danger); background: var(--color-danger-soft); border-color: var(--color-danger); }
.none { color: var(--color-text-muted); background: var(--color-bg); border-color: var(--color-border); }
@media (max-width: 720px) { .patient { grid-template-columns: repeat(2, minmax(0, 1fr)); } .summary { grid-template-columns: 1fr; } }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar label { font-weight: 700; font-size: .92rem; margin-right: 8px; }
select, input { font: inherit; color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-text-muted); border-radius: 6px; padding: 8px 12px; min-height: 44px; }
input { width: 100%; }
input::placeholder { color: var(--color-placeholder); }
button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 20px; border-radius: 6px; cursor: pointer; }
.primary { background: var(--color-primary); color: var(--color-on-primary); border: 1px solid var(--color-primary); }
.primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
.ghost { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); }
.ghost:hover { background: var(--color-primary-soft); }
:is(select, input, button):focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-size: .85rem; color: var(--color-text-muted); padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
td { padding: 10px 14px; border-bottom: 1px solid var(--color-border); }
tr:last-child td { border-bottom: 0; }
td:first-child { font-weight: 700; }
.pill { display: inline-block; padding: 2px 12px; border-radius: 999px; font-weight: 700; font-size: .85rem; }
.empty { padding: 28px; text-align: center; color: var(--color-text-muted); }
dialog { border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-surface); color: var(--color-text); padding: 22px; width: min(440px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h2 { margin: 0 0 14px; font-size: 1.2rem; }
dialog label { display: block; font-weight: 700; font-size: .9rem; margin: 12px 0 6px; }
.err { color: var(--color-danger); font-size: .85rem; min-height: 1.2em; margin-top: 10px; }
.row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
</style>
</head>
<body>
<header class="bar">Carteira de vacinação</header>
<main>
  <dl class="card patient">
    <div><dt>Paciente</dt><dd>Maria da Silva Souza</dd></div>
    <div><dt>CPF</dt><dd>123.456.789-09</dd></div>
    <div><dt>Nascimento</dt><dd>14/03/1992</dd></div>
    <div><dt>Cartão SUS</dt><dd>898 0012 3456 7890</dd></div>
  </dl>

  <section class="summary" aria-label="Resumo">
    <div class="stat ok"><span>Doses aplicadas</span><b id="nOk">0</b></div>
    <div class="stat soon"><span>Próximas em 30 dias</span><b id="nSoon">0</b></div>
    <div class="stat late"><span>Doses atrasadas</span><b id="nLate">0</b></div>
  </section>

  <div class="toolbar">
    <div>
      <label for="filtro">Mostrar</label>
      <select id="filtro">
        <option value="">Todas</option><option value="ok">Aplicadas</option><option value="soon">Próximas</option>
        <option value="late">Atrasadas</option><option value="none">Agendadas</option>
      </select>
    </div>
    <button class="primary" id="nova">Registrar dose</button>
  </div>

  <div class="card scroll">
    <table>
      <thead><tr><th>Vacina</th><th>Dose</th><th>Data</th><th>Lote</th><th>Unidade</th><th>Situação</th></tr></thead>
      <tbody id="corpo"></tbody>
    </table>
    <div class="empty" id="vazio" hidden>Nenhuma dose nesta situação.</div>
  </div>
</main>

<dialog id="dlg">
  <form id="form" method="dialog" novalidate>
    <h2>Registrar dose</h2>
    <label for="f-vacina">Vacina</label><input id="f-vacina" placeholder="Ex.: Influenza">
    <label for="f-dose">Dose</label>
    <select id="f-dose" style="width:100%"><option>1ª dose</option><option>2ª dose</option><option>3ª dose</option><option>Reforço</option><option>Dose única</option></select>
    <label for="f-data">Data da aplicação</label><input id="f-data" type="date">
    <label for="f-lote">Lote <small>(opcional)</small></label><input id="f-lote">
    <label for="f-un">Unidade de saúde <small>(opcional)</small></label><input id="f-un">
    <div class="err" id="erro" role="alert"></div>
    <div class="row">
      <button type="button" class="ghost" id="cancelar">Cancelar</button>
      <button type="submit" class="primary">Salvar dose</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
const desloca = (d, m = 0, y = 0) => { const x = new Date(hoje); x.setDate(x.getDate() + d); x.setMonth(x.getMonth() + m); x.setFullYear(x.getFullYear() + y); return x; };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const br = d => d.toLocaleDateString('pt-BR');
const rotulo = { ok: 'Aplicada', soon: 'Próxima', late: 'Atrasada', none: 'Agendada' };

const doses = [
  { v: 'BCG', d: 'Dose única', ap: desloca(0, 0, -30), lote: 'BC1021', un: 'Maternidade Municipal' },
  { v: 'Hepatite B', d: '3ª dose', ap: desloca(0, 0, -29), lote: 'HB7788', un: 'UBS Centro' },
  { v: 'Febre amarela', d: 'Dose única', ap: desloca(0, 0, -8), lote: 'FA3310', un: 'UBS Centro' },
  { v: 'Covid-19', d: 'Reforço', ap: desloca(0, -7), lote: 'CV9921', un: 'UBS Taquaral' },
  { v: 'dTpa', d: 'Reforço', prev: desloca(-12) },
  { v: 'Influenza', d: 'Dose anual', prev: desloca(18) },
  { v: 'HPV', d: '2ª dose', prev: desloca(0, 4) }
];
function situacao(x) {
  if (x.ap) return 'ok';
  const dias = Math.round((x.prev - hoje) / 864e5);
  return dias < 0 ? 'late' : dias <= 30 ? 'soon' : 'none';
}
function desenhar() {
  const f = $('filtro').value, corpo = $('corpo');
  const lista = doses.filter(x => !f || situacao(x) === f);
  corpo.innerHTML = '';
  lista.forEach(x => {
    const s = situacao(x), tr = document.createElement('tr');
    [x.v, x.d, x.ap ? br(x.ap) : 'Prevista ' + br(x.prev), x.lote || '—', x.un || '—'].forEach(t => {
      const td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
    });
    const td = document.createElement('td'), p = document.createElement('span');
    p.className = 'pill ' + s; p.textContent = rotulo[s]; td.appendChild(p); tr.appendChild(td);
    corpo.appendChild(tr);
  });
  $('vazio').hidden = lista.length > 0;
  ['ok', 'soon', 'late'].forEach(k => $({ ok: 'nOk', soon: 'nSoon', late: 'nLate' }[k]).textContent = doses.filter(x => situacao(x) === k).length);
}
$('filtro').addEventListener('change', desenhar);
$('nova').addEventListener('click', () => { $('form').reset(); $('f-data').max = iso(hoje); $('f-data').value = iso(hoje); $('erro').textContent = ''; $('dlg').showModal(); $('f-vacina').focus(); });
$('cancelar').addEventListener('click', () => $('dlg').close());
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('f-vacina').value.trim(), data = $('f-data').value;
  if (!v) { $('erro').textContent = 'Informe o nome da vacina.'; $('f-vacina').focus(); return; }
  if (!data) { $('erro').textContent = 'Informe a data da aplicação.'; $('f-data').focus(); return; }
  const [y, m, d] = data.split('-').map(Number), ap = new Date(y, m - 1, d);
  if (ap > hoje) { $('erro').textContent = 'A data da aplicação não pode ser futura.'; return; }
  doses.unshift({ v, d: $('f-dose').value, ap, lote: $('f-lote').value.trim(), un: $('f-un').value.trim() });
  $('dlg').close(); desenhar();
});
desenhar();
</script>
</body>
</html>
