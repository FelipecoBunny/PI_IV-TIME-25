<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Tutor | PetHealth</title>

  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

  <header class="app-header" style="position: absolute; top: 0; width: 100%;">
    <div class="app-header__inner">
      <div class="app-header__brand">PetHealth</div>
      <nav aria-label="Navegação">
        <a href="inicial.html" class="app-header__link">voltar</a>
      </nav>
    </div>
  </header>

  <main class="auth-card" style="margin-top: 60px;">
    <h1>Perfil do Tutor</h1>
    <p class="subtitle">informaçoes</p>

    <form id="profile-form" novalidate>
      <div id="form-error" class="alert" role="alert" hidden></div>
      <div id="form-success" class="alert alert--success" role="alert" hidden style="background: #e6f4ea; color: #137333; padding: 10px; border-radius: 4px; margin-bottom: 12px;">
        Dados atualizados
      </div>

      <div class="field">
        <label for="tutor-name">nome</label>
        <input type="text" id="tutor-name" name="tutor-name" autocomplete="name" placeholder="Seu nome" required>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="nome@exemplo.com" required>
      </div>

      <div class="field">
        <label for="password">nova senha</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn">salvar</button>
    </form>

    </p>
  </main>
</body>

</html>
