<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | PetHealth</title>

  <!-- A ordem importa: cores, depois estilos globais, depois estilos desta página -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-card">
    <div class="brand">PetHealth</div>
    <p class="subtitle">A carteira de saúde digital do seu pet</p>

    <h1>Entrar</h1>

    <form id="login-form" novalidate>
      <div id="form-error" class="alert" role="alert" hidden></div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="nome@exemplo.com" required>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••"
          required>
      </div>

      <button type="submit" class="btn">Entrar</button>
    </form>

    <p class="auth-footer">
      Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
    </p>
  </main>

  <script src="js/login.js"></script>
</body>

</html>
