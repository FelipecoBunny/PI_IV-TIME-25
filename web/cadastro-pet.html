<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar pet | PetHealth</title>

  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-card">
    <div class="brand">PetHealth</div>
    <p class="subtitle">Etapa 2 de 2: seu pet</p>

    <h1>Cadastrar seu pet</h1>

    <form id="pet-form" novalidate>
      <div id="form-error" class="alert" role="alert" hidden></div>

      <div class="field">
        <label for="pet-name">Nome do pet</label>
        <input type="text" id="pet-name" name="pet-name" placeholder="Luna" required>
      </div>

      <div class="field">
        <label for="species">Espécie</label>
        <select id="species" name="species" required>
          <option value="">Selecione</option>
          <option value="cachorro">Cachorro</option>
          <option value="gato">Gato</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <div class="field">
        <label for="breed">Raça <span class="optional">(opcional)</span></label>
        <input type="text" id="breed" name="breed" placeholder="Poodle">
      </div>

      <div class="field">
        <label for="birth-date">Data de nascimento</label>
        <input type="date" id="birth-date" name="birth-date" required>
        <p class="hint">Se não souber o dia exato, use uma data aproximada.</p>
      </div>

      <div class="field">
        <label for="weight">Peso (kg)</label>
        <input type="number" id="weight" name="weight" min="0" step="0.1" inputmode="decimal" placeholder="34.0"
          required>
      </div>

      <div class="field">
        <label for="photo">Foto <span class="optional">(opcional)</span></label>
        <input type="file" id="photo" name="photo" accept="image/*">
      </div>

      <button type="submit" class="btn">Cadastrar pet</button>
    </form>

    <script src="js/cadastro-pet.js"></script>
</body>

</html>
