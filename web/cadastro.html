<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | PetHealth</title>

  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

  <main class="auth-card">
    <div class="brand">PetHealth</div>
    <p class="subtitle">Etapa 1 de 2: sua conta</p>

    <h1>Criar conta</h1>

    <form id="signup-form" novalidate>
      <div id="form-error" class="alert" role="alert" hidden></div>

      <div class="field">
        <label for="tutor-name">Seu nome</label>
        <input type="text" id="tutor-name" name="tutor-name" autocomplete="name" placeholder="Maria Silva" required>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="nome@exemplo.com" required>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••"
          required>
        <p class="hint">Mínimo de 8 caracteres.</p>
      </div>

      <div class="field">
        <label for="password-confirm">Confirmar senha</label>
        <input type="password" id="password-confirm" name="password-confirm" autocomplete="new-password"
          placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Criar conta</button>
    </form>

    <p class="auth-footer">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </main>

  <script src="js/cadastro.js"></script>
</body>

</html>
